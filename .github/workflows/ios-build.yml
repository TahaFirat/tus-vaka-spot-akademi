name: iOS Build & TestFlight Deploy

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS with Xcode on Cloud Mac
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID || 'N7XD86ZSMH' }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID || 'c4346abc-087b-4e87-a020-6737592faa26' }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD || 'LockIn2026!' }}

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Build Web Application
        run: npm run build

      - name: 5. Sync Capacitor iOS Project
        run: |
          npx cap sync ios
          cat > ios/App/App/config.xml << 'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <widget version="1.6.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
          </widget>
          EOF

      - name: 6. Install Apple Distribution Certificate & Auto-Provision Profile
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          elif [ -f "apple_certs/certificate.p12" ]; then
            cp apple_certs/certificate.p12 $RUNNER_TEMP/certificate.p12
          fi

          if [ -f "$RUNNER_TEMP/certificate.p12" ]; then
            security import $RUNNER_TEMP/certificate.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')
            echo "HAS_CERT=true" >> $GITHUB_ENV
          fi

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          if [ -z "$APP_STORE_CONNECT_API_KEY" ] && [ -f "apple_certs/AuthKey_N7XD86ZSMH.p8" ]; then
            export APP_STORE_CONNECT_API_KEY="$(cat apple_certs/AuthKey_N7XD86ZSMH.p8)"
          fi

          if [ -n "$APP_STORE_CONNECT_API_KEY" ] && [ -n "$APP_STORE_CONNECT_ISSUER_ID" ]; then
            echo "Auto-provisioning Main & Widget Bundle IDs and App Store Profiles via App Store Connect API..."
            pip3 install --break-system-packages --quiet pyjwt cryptography requests || pip3 install --user --quiet pyjwt cryptography requests
            python3 - << 'PYEOF'
          import os, re, time, base64, jwt, requests

          key_id = os.environ.get('APP_STORE_CONNECT_KEY_ID', 'N7XD86ZSMH').strip()
          issuer_id = os.environ.get('APP_STORE_CONNECT_ISSUER_ID', '').strip()
          raw_key = os.environ.get('APP_STORE_CONNECT_API_KEY', '').strip()
          b64 = re.sub(r'-----BEGIN [^-]+-----|-----END [^-]+-----|\s+', '', raw_key)
          lines = [b64[i:i+64] for i in range(0, len(b64), 64)]
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(lines) + '\n-----END PRIVATE KEY-----\n'

          now = int(time.time()) - 30
          token = jwt.encode(
              {'iss': issuer_id, 'iat': now, 'exp': now + 1100, 'aud': 'appstoreconnect-v1'},
              pem, algorithm='ES256', headers={'kid': key_id, 'typ': 'JWT'}
          )
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

          cr = requests.get('https://api.appstoreconnect.apple.com/v1/certificates', headers=headers)
          certs = cr.json().get('data', [])
          dist_certs = [c['id'] for c in certs if 'DISTRIBUTION' in c['attributes'].get('certificateType', '')]

          def ensure_bundle_and_profile(bundle_ident, bundle_name, prof_name, out_filename):
              r = requests.get('https://api.appstoreconnect.apple.com/v1/bundleIds', headers=headers, params={'filter[identifier]': bundle_ident})
              bid = None
              for b in r.json().get('data', []):
                  if b['attributes']['identifier'] == bundle_ident:
                      bid = b['id']
                      break
              if not bid:
                  cr_b = requests.post('https://api.appstoreconnect.apple.com/v1/bundleIds', headers=headers, json={
                      'data': {'type': 'bundleIds', 'attributes': {'identifier': bundle_ident, 'name': bundle_name, 'platform': 'IOS'}}
                  })
                  if cr_b.status_code in (200, 201):
                      bid = cr_b.json()['data']['id']
              if bid and dist_certs:
                  pr = requests.get('https://api.appstoreconnect.apple.com/v1/profiles', headers=headers, params={'filter[name]': prof_name})
                  prof_content = None
                  for p in pr.json().get('data', []):
                      if p['attributes'].get('profileState') == 'ACTIVE':
                          prof_content = p['attributes']['profileContent']
                          break
                  if not prof_content:
                      cpr = requests.post('https://api.appstoreconnect.apple.com/v1/profiles', headers=headers, json={
                          'data': {
                              'type': 'profiles',
                              'attributes': {'name': prof_name, 'profileType': 'IOS_APP_STORE'},
                              'relationships': {
                                  'bundleId': {'data': {'type': 'bundleIds', 'id': bid}},
                                  'certificates': {'data': [{'type': 'certificates', 'id': cid} for cid in dist_certs]}
                              }
                          }
                      })
                      if cpr.status_code in (200, 201):
                          prof_content = cpr.json()['data']['attributes']['profileContent']
                  if prof_content:
                      os.makedirs('ios/App', exist_ok=True)
                      with open(out_filename, 'wb') as f:
                          f.write(base64.b64decode(prof_content))
                      print("Saved", out_filename)

          ensure_bundle_and_profile('com.tus.akademi', 'TUS Vaka Spot Akademi', 'TUSVakaSpotAkademi AppStore Profile', 'ios/App/TUSVakaSpotAkademi.mobileprovision')
          ensure_bundle_and_profile('com.tus.akademi.widget', 'TUS Vaka Spot Widget', 'TUSVakaSpotAkademi Widget Profile', 'ios/App/TUSVakaSpotWidget.mobileprovision')
          PYEOF
          fi

          PROFILE_FILE="ios/App/TUSVakaSpotAkademi.mobileprovision"
          WIDGET_PROFILE_FILE="ios/App/TUSVakaSpotWidget.mobileprovision"

          if [ -f "$PROFILE_FILE" ]; then
            echo "Installing Main Provisioning Profile: $PROFILE_FILE"
            security cms -D -i "$PROFILE_FILE" > $RUNNER_TEMP/profile.plist
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" $RUNNER_TEMP/profile.plist)
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" $RUNNER_TEMP/profile.plist)
            TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" $RUNNER_TEMP/profile.plist)
            APP_ID_FULL=$(/usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" $RUNNER_TEMP/profile.plist)
            BUNDLE_ID="${APP_ID_FULL#${TEAM_ID}.}"

            cp "$PROFILE_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/${PROFILE_UUID}.mobileprovision

            WIDGET_PROFILE_NAME=""
            if [ -f "$WIDGET_PROFILE_FILE" ]; then
              echo "Installing Widget Provisioning Profile: $WIDGET_PROFILE_FILE"
              security cms -D -i "$WIDGET_PROFILE_FILE" > $RUNNER_TEMP/widget_profile.plist
              WIDGET_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" $RUNNER_TEMP/widget_profile.plist)
              WIDGET_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" $RUNNER_TEMP/widget_profile.plist)
              cp "$WIDGET_PROFILE_FILE" ~/Library/MobileDevice/Provisioning\ Profiles/${WIDGET_UUID}.mobileprovision
            fi

            echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
            echo "WIDGET_PROFILE_NAME=$WIDGET_PROFILE_NAME" >> $GITHUB_ENV
            echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
            echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV

            cat > ios/App/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.tus.akademi</key>
                  <string>${PROFILE_NAME}</string>
                  <key>com.tus.akademi.widget</key>
                  <string>${WIDGET_PROFILE_NAME}</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF
          fi

      - name: 6.5. Wire TusWidgetExtension Target into Xcode Project
        run: |
          gem list -i xcodeproj >/dev/null 2>&1 || gem install xcodeproj --no-document --user-install
          export GEM_PATH="$(ruby -r rubygems -e 'puts Gem.path.join(":")'):$(ruby -r rubygems -e 'puts Gem.user_dir')"
          BUILD_NUMBER="${{ github.run_number }}" ruby ios/App/setup_widget_target.rb

      - name: 7. Build Xcode Project Archive
        run: |
          cd ios/App
          for i in 1 2 3; do
            xcodebuild -project App.xcodeproj -scheme App -resolvePackageDependencies && break || sleep 5
          done
          if [ "$HAS_CERT" = "true" ] && [ -n "$PROFILE_NAME" ]; then
            echo "Building multi-target App + TusWidgetExtension with official Apple Code Signing (Build #${{ github.run_number }})..."
            xcodebuild -project App.xcodeproj \
                       -scheme App \
                       -destination 'generic/platform=iOS' \
                       -configuration Release \
                       CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
                       MARKETING_VERSION="1.6.1" \
                       clean archive \
                       -archivePath ./build/App.xcarchive
          else
            echo "Building archive (unsigned fallback until .mobileprovision or APP_STORE_CONNECT_ISSUER_ID is provided)..."
            xcodebuild -project App.xcodeproj \
                       -scheme App \
                       -destination 'generic/platform=iOS' \
                       -configuration Release \
                       CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
                       DEVELOPMENT_TEAM="U3YT2CXH58" \
                       CODE_SIGNING_ALLOWED=NO \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGN_IDENTITY="" \
                       clean archive \
                       -archivePath ./build/App.xcarchive
          fi

      - name: 8. Export Official Signed App IPA
        run: |
          cd ios/App
          if [ -f "exportOptions.plist" ] && [ "$HAS_CERT" = "true" ] && [ -n "$PROFILE_NAME" ]; then
            echo "Exporting signed App.ipa using exportOptions.plist..."
            xcodebuild -exportArchive \
                       -archivePath ./build/App.xcarchive \
                       -exportPath ./build/export \
                       -exportOptionsPlist exportOptions.plist
            cp ./build/export/*.ipa ./build/App.ipa || true
          fi

          if [ ! -f "./build/App.ipa" ]; then
            echo "Packaging archive App.ipa..."
            cd build
            mkdir -p Payload
            cp -R App.xcarchive/Products/Applications/App.app Payload/
            zip -r App.ipa Payload
            cd ..
          fi
          cd ../..

      - name: 9. Upload Release Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: TUSVakaSpotAkademi-Signed-iOS-App
          path: |
            ios/App/build/App.ipa
            ios/App/build/App.xcarchive
          retention-days: 14

      - name: 10. Upload to Apple TestFlight / App Store Connect
        if: env.APP_STORE_CONNECT_ISSUER_ID != ''
        run: |
          set -o pipefail

          if [ -z "$APP_STORE_CONNECT_API_KEY" ] && [ -f "apple_certs/AuthKey_N7XD86ZSMH.p8" ]; then
            export APP_STORE_CONNECT_API_KEY="$(cat apple_certs/AuthKey_N7XD86ZSMH.p8)"
          fi

          KEY_ID=$(echo "$APP_STORE_CONNECT_KEY_ID" | tr -d '[:space:]')
          ISSUER_ID=$(echo "$APP_STORE_CONNECT_ISSUER_ID" | tr -d '[:space:]')

          pip3 install --break-system-packages --quiet pyjwt cryptography requests || pip3 install --user --quiet pyjwt cryptography requests

          python3 - << 'PYEOF'
          import os, re, time, jwt, requests

          key_id = os.environ.get('APP_STORE_CONNECT_KEY_ID', 'N7XD86ZSMH').strip()
          issuer_id = os.environ.get('APP_STORE_CONNECT_ISSUER_ID', '').strip()
          raw = os.environ.get('APP_STORE_CONNECT_API_KEY', '').strip()
          b64 = re.sub(r'-----BEGIN [^-]+-----|-----END [^-]+-----|\s+', '', raw)
          lines = [b64[i:i+64] for i in range(0, len(b64), 64)]
          pem = '-----BEGIN PRIVATE KEY-----\n' + '\n'.join(lines) + '\n-----END PRIVATE KEY-----\n'
          for d in [os.path.expanduser('~/.appstoreconnect/private_keys'), os.path.expanduser('~/.private_keys'), './private_keys']:
              os.makedirs(d, exist_ok=True)
              p = os.path.join(d, f'AuthKey_{key_id}.p8')
              with open(p, 'w') as f:
                  f.write(pem)
              os.chmod(p, 0o600)

          # Wait up to 5 minutes if the App record for com.tus.akademi is being created in App Store Connect UI
          for attempt in range(20):
              token = jwt.encode(
                  {'iss': issuer_id, 'iat': int(time.time()), 'exp': int(time.time()) + 900, 'aud': 'appstoreconnect-v1'},
                  pem, algorithm='ES256', headers={'kid': key_id, 'typ': 'JWT'}
              )
              headers = {'Authorization': f'Bearer {token}'}
              r = requests.get('https://api.appstoreconnect.apple.com/v1/apps', headers=headers, params={'filter[bundleId]': 'com.tus.akademi'})
              apps = r.json().get('data', [])
              if apps:
                  print(f"Found App Store Connect App record for com.tus.akademi (App ID: {apps[0]['id']})!")
                  break
              print(f"[Attempt {attempt+1}/20] Waiting for App record 'com.tus.akademi' in App Store Connect (https://appstoreconnect.apple.com/apps)...")
              time.sleep(15)
          PYEOF

          UPLOAD_SUCCESS=false

          echo "=== Attempting Upload via xcrun altool ==="
          if xcrun altool --upload-app --type ios --file ./ios/App/build/App.ipa --apiKey "${KEY_ID}" --apiIssuer "${ISSUER_ID}" --verbose 2>&1 | tee altool.log; then
            UPLOAD_SUCCESS=true
          else
            cat altool.log >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$UPLOAD_SUCCESS" = false ]; then
            TRANSPORTER=$(find /Applications/Xcode* -name iTMSTransporter 2>/dev/null | head -n 1)
            if [ -n "$TRANSPORTER" ] && [ -x "$TRANSPORTER" ]; then
              if "$TRANSPORTER" -m upload -assetFile ./ios/App/build/App.ipa -apiKey "${KEY_ID}" -apiIssuer "${ISSUER_ID}" 2>&1 | tee itms.log; then
                UPLOAD_SUCCESS=true
              else
                cat itms.log >> $GITHUB_STEP_SUMMARY
              fi
            fi
          fi

          if [ "$UPLOAD_SUCCESS" = false ]; then
            python3 - << 'PYEOF'
          import json, os
          key_id = os.environ.get('APP_STORE_CONNECT_KEY_ID', 'N7XD86ZSMH').strip()
          issuer_id = os.environ.get('APP_STORE_CONNECT_ISSUER_ID', '').strip()
          data = {
            'key_id': key_id,
            'issuer_id': issuer_id,
            'key_filepath': os.path.expanduser(f'~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8'),
            'duration': 1200,
            'in_house': False
          }
          with open('api_key.json', 'w') as f:
              json.dump(data, f)
          PYEOF
            if fastlane pilot upload --ipa ./ios/App/build/App.ipa --api_key_path api_key.json --skip_waiting_for_build_processing true 2>&1 | tee fastlane.log; then
              UPLOAD_SUCCESS=true
            else
              cat fastlane.log >> $GITHUB_STEP_SUMMARY
            fi
          fi

          if [ "$UPLOAD_SUCCESS" = false ]; then
            exit 1
          fi
